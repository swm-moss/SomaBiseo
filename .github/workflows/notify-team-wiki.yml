name: notify-team-wiki

# 이 파일을 각 프로젝트 레포(EmberRoom, SomaBiseo, 본과정 레포...)의
#   .github/workflows/notify-team-wiki.yml
# 위치에 복사해 넣는다. push/PR/issue가 생기면 team-wiki로 신호(repository_dispatch)를
# 보내 org-state 다이제스트를 즉시 다시 굽게 만든다.
#
# 동작 조건: 이 레포의 시크릿에 MOSS_BOT_TOKEN(team-wiki에 Contents:R/W 권한 PAT)이 있어야 한다.
# 없으면 조용히 건너뛴다(실패 X) — 시크릿을 넣는 순간 자동으로 활성화된다.

on:
  push:
  pull_request:
    types: [opened, closed, reopened, synchronize]
  issues:
    types: [opened, closed, reopened, edited]

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to team-wiki
        env:
          GH_TOKEN: ${{ secrets.MOSS_BOT_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "MOSS_BOT_TOKEN 미설정 — team-wiki 알림 건너뜀"
            exit 0
          fi
          gh api repos/swm-moss/team-wiki/dispatches -f event_type=org-update
